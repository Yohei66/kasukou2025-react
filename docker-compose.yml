version: '3.8'

services:
  db:
    image: mariadb:10.5
    container_name: dev-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: devdb
      MYSQL_USER: devuser
      MYSQL_PASSWORD: devpass
    ports:
      - "3309:3306"
    volumes:
      - db_data:/var/lib/mysql

  php:
    build: ./api
    container_name: dev-php
    environment:
      # 管理者ログイン（1人だけ）。本番はサーバー側で設定し、この既定値は使わないこと
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-kasukou-dev}
      # コート中止連絡の合言葉。本番はサーバー側で設定し、この値は使わないこと
      CANCEL_PASSWORD: ${CANCEL_PASSWORD:-kasukou-dev}
      # 問い合わせフォームの通知先と差出人。両方そろって初めてメールを送る
      CONTACT_TO: ${CONTACT_TO:-}
      CONTACT_FROM: ${CONTACT_FROM:-}
    working_dir: /var/www/api
    volumes:
      - ./api:/var/www/api
      - ./public:/var/www/html/public
    command: php -S 0.0.0.0:9000 -t /var/www/api
    ports:
      - "9000:9000"

  nginx:
    image: nginx:stable-alpine
    container_name: dev-nginx
    ports:
      - "8080:80"
    volumes:
      - ./public_html:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  node:
    image: node:18
    container_name: dev-node
    working_dir: /var/www/react
    # ホスト上のパッケージ情報をコンテナ内にマウント
    volumes:
      - ./:/var/www/react      # <-- mount entire project, including index.html, public/, etc
      - /var/www/react/node_modules  # <-- keep node_modules in a Docker volume

      # - ./src:/var/www/react/src
      # - ./package.json:/var/www/react/package.json
      # - ./package-lock.json:/var/www/react/package-lock.json
      # - ./vite.config.ts:/var/www/react/vite.config.ts
      # node_modules はコンテナ内で管理
      # - /var/www/react/node_modules
    ports:
      - "3000:3000"
    # コンテナ起動時に依存を入れて dev サーバーを立ち上げる
    command: sh -c "npm install && npm run dev"

volumes:
  db_data:
